<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Sistema LP MXRC03</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0B0E14;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #E2E8F0;
    }

    .card {
      background-color: #121824;
      border: 1px solid #1E293B;
      border-radius: 18px;
      width: 100%;
      max-width: 440px;
      padding: 44px 36px 36px 36px;
      text-align: center;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
    }

    .avatar-wrapper {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      background-color: #211B38;
      border-radius: 50%;
      margin-bottom: 22px;
    }

    .avatar-wrapper svg {
      width: 32px;
      height: 32px;
      fill: #8B5CF6;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }

    .subtitle {
      font-size: 13.5px;
      color: #94A3B8;
      margin-bottom: 24px;
    }

    .bookmark-hint {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: rgba(30, 41, 59, 0.6);
      border: 1px dashed #334155;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 24px;
      font-size: 12.5px;
      color: #CBD5E1;
    }

    .bookmark-hint kbd {
      background: #0F172A;
      border: 1px solid #475569;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 11px;
      font-weight: 600;
      color: #F8FAFC;
    }

    .btn-submit {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      background: linear-gradient(180deg, #F59E0B 0%, #D97706 100%);
      color: #000000;
      font-size: 15px;
      font-weight: 700;
      padding: 14px 20px;
      border-radius: 9px;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(217, 119, 6, 0.35);
      border: none;
    }

    .btn-submit:hover {
      background: linear-gradient(180deg, #FBBF24 0%, #E58607 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(217, 119, 6, 0.45);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .btn-submit svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }
