<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema LP MXRC03</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0B0E14;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #E2E8F0;
    }

    .card {
      background-color: #121824;
      border: 1px solid #1E293B;
      border-radius: 18px;
      width: 100%;
      max-width: 440px;
      padding: 44px 36px 36px 36px;
      text-align: center;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
    }

    .avatar-wrapper {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      background-color: #211B38;
      border-radius: 50%;
      margin-bottom: 22px;
    }

    .avatar-wrapper svg {
      width: 32px;
      height: 32px;
      fill: #8B5CF6;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }

    .subtitle {
      font-size: 13.5px;
      color: #94A3B8;
      margin-bottom: 28px;
    }

    .bookmark-hint {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: rgba(30, 41, 59, 0.6);
      border: 1px dashed #334155;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 26px;
      font-size: 12.5px;
      color: #CBD5E1;
    }

    .bookmark-hint kbd {
      background: #0F172A;
      border: 1px solid #475569;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 11px;
      font-weight: 600;
      color: #F8FAFC;
    }

    .btn-submit {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      background: linear-gradient(180deg, #F59E0B 0%, #D97706 100%);
      color: #000000;
      font-size: 15px;
      font-weight: 700;
      padding: 14px 20px;
      border-radius: 9px;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(217, 119, 6, 0.35);
      border: none;
    }

    .btn-submit:hover {
      background: linear-gradient(180deg, #FBBF24 0%, #E58607 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(217, 119, 6, 0.45);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .btn-submit svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .footer-note {
      margin-top: 24px;
      font-size: 11.5px;
      color: #64748B;
    }

    .footer-note span {
      color: #10B981;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="avatar-wrapper">
      <svg viewBox="0 0 24 24">
        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
      </svg>
    </div>

    <h1>Sistema LP MXRC03</h1>
    <p class="subtitle">Acceso directo al portal de auditorías operativas</p>

    <!-- Indicación para que guarden este link en sus navegadores -->
    <div class="bookmark-hint">
      ⭐ Guarda este enlace: presiona <kbd>Ctrl</kbd> + <kbd>D</kbd>
    </div>

    <!-- Botón con la URL de Grid -->
    <a href="https://grid.adminml.com/d/01M6KEX04T6A6YSAZ5S2NTTG8S/raw" class="btn-submit">
      <svg viewBox="0 0 24 24">
        <path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/>
      </svg>
      Ingresar al Portal
    </a>

    <p class="footer-note">Estado: <span>Conexión activa</span> • MXRC03</p>
  </div>

</body>
</html>
